AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ServerlessOps Catalog API for Backstage

Parameters:
  Domain:
    Type: String
    Description: 'Application Platform'

  System:
    Type: String
    Description: 'Application System'

  Component:
    Type: String
    Description: 'Application Component'

  CodeBranch:
    Type: String
    Description: "Name of deployment branch"

  Hostname:
    Type: String
    Description: Site FQDN

  DnsZoneId:
    Type: String
    Description: Route53 Hosted Zone ID

  CognitoUserPoolArn:
    Type: String
    Description: Cognito User Pool ARN

  SqsQueueArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /platform/backstage/backstage-app/main/SqsQueueArn
    Description: ARN of the Backstage catalog events FIFO queue

  # NOTE: This project's `yarn run sam:build` doesn't handle cfn-parameters.json so if we want
  # to change these values to effect the build we need to do it here.
  EnableSourceMaps:
    Type: String
    Description: Enable source maps for debugging
    Default: false

  EnableMinify:
    Type: String
    Description: Enable minification for the build
    Default: true


Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 5
    MemorySize: 128
    Environment:
      Variables:
        DDB_TABLE_NAME: !Ref DdbTable
        POWERTOOLS_SERVICE_NAME: !Ref AWS::StackName


Resources:
  # DDB
  DdbTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  CatalogEventPipeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/pipes/${AWS::StackName}-catalog-events'
      RetentionInDays: 30

  CatalogEventPipeFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  CatalogEventPipeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:pipes:${AWS::Region}:${AWS::AccountId}:pipe/*'
      Policies:
        - PolicyName: CatalogEventPipeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                Resource: !GetAtt DdbTable.StreamArn
              - Effect: Allow
                Action:
                  - dynamodb:ListStreams
                Resource: '*' # ListStreams does not support resource-level permissions.
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !Ref SqsQueueArn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt CatalogEventPipeFailureQueue.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${CatalogEventPipeLogGroup.Arn}:*'

  CatalogEventStreamLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/vendedlogs/pipes/${AWS::StackName}-catalog-stream-records'
      RetentionInDays: 30

  CatalogEventStreamLogStream:
    Type: AWS::Logs::LogStream
    Properties:
      LogGroupName: !Ref CatalogEventStreamLogGroup
      LogStreamName: ddb-stream-records

  CatalogEventLogPipeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:pipes:${AWS::Region}:${AWS::AccountId}:pipe/*'
      Policies:
        - PolicyName: CatalogEventLogPipeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                Resource: !GetAtt DdbTable.StreamArn
              - Effect: Allow
                Action:
                  - dynamodb:ListStreams
                Resource: '*' # ListStreams does not support resource-level permissions.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${CatalogEventStreamLogGroup.Arn}:*'

  CatalogEventLogPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Source: !GetAtt DdbTable.StreamArn
      # Pipes expects the log group ARN without the trailing ':*' that GetAtt returns.
      Target: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${CatalogEventStreamLogGroup}'
      RoleArn: !GetAtt CatalogEventLogPipeRole.Arn
      DesiredState: RUNNING
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 10
          MaximumRetryAttempts: 3
          MaximumRecordAgeInSeconds: 3600
      TargetParameters:
        CloudWatchLogsParameters:
          LogStreamName: !Ref CatalogEventStreamLogStream

  CatalogEventInsertPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Source: !GetAtt DdbTable.StreamArn
      Target: !Ref SqsQueueArn
      RoleArn: !GetAtt CatalogEventPipeRole.Arn
      DesiredState: RUNNING
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 1
          MaximumRetryAttempts: 5
          MaximumRecordAgeInSeconds: 86400
          DeadLetterConfig:
            Arn: !GetAtt CatalogEventPipeFailureQueue.Arn
        FilterCriteria:
          Filters:
            - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"itemType":{"S":["entity"]}}}}'
      TargetParameters:
        InputTemplate: >-
          {
            "eventId": "<$.eventID>",
            "changeType": "create",
            "entityRef": "<$.dynamodb.Keys.sk.S>",
            "entity": <$.dynamodb.NewImage>,
            "source": "serverlessops-catalog-api",
            "schemaVersion": "1"
          }
        SqsQueueParameters:
          MessageGroupId: $.dynamodb.Keys.sk.S
          MessageDeduplicationId: $.eventID
      LogConfiguration:
        Level: ERROR
        CloudwatchLogsLogDestination:
          LogGroupArn: !GetAtt CatalogEventPipeLogGroup.Arn

  CatalogEventModifyPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Source: !GetAtt DdbTable.StreamArn
      Target: !Ref SqsQueueArn
      RoleArn: !GetAtt CatalogEventPipeRole.Arn
      DesiredState: RUNNING
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 1
          MaximumRetryAttempts: 5
          MaximumRecordAgeInSeconds: 86400
          DeadLetterConfig:
            Arn: !GetAtt CatalogEventPipeFailureQueue.Arn
        FilterCriteria:
          Filters:
            - Pattern: '{"eventName":["MODIFY"],"dynamodb":{"NewImage":{"itemType":{"S":["entity"]}}}}'
      TargetParameters:
        InputTemplate: >-
          {
            "eventId": "<$.eventID>",
            "changeType": "update",
            "entityRef": "<$.dynamodb.Keys.sk.S>",
            "entity": <$.dynamodb.NewImage>,
            "source": "serverlessops-catalog-api",
            "schemaVersion": "1"
          }
        SqsQueueParameters:
          MessageGroupId: $.dynamodb.Keys.sk.S
          MessageDeduplicationId: $.eventID
      LogConfiguration:
        Level: ERROR
        CloudwatchLogsLogDestination:
          LogGroupArn: !GetAtt CatalogEventPipeLogGroup.Arn

  CatalogEventRemovePipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Source: !GetAtt DdbTable.StreamArn
      Target: !Ref SqsQueueArn
      RoleArn: !GetAtt CatalogEventPipeRole.Arn
      DesiredState: RUNNING
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: LATEST
          BatchSize: 1
          MaximumRetryAttempts: 5
          MaximumRecordAgeInSeconds: 86400
          DeadLetterConfig:
            Arn: !GetAtt CatalogEventPipeFailureQueue.Arn
        FilterCriteria:
          Filters:
            - Pattern: '{"eventName":["REMOVE"],"dynamodb":{"OldImage":{"itemType":{"S":["entity"]}}}}'
      TargetParameters:
        InputTemplate: >-
          {
            "eventId": "<$.eventID>",
            "changeType": "delete",
            "entityRef": "<$.dynamodb.Keys.sk.S>",
            "entity": <$.dynamodb.OldImage>,
            "source": "serverlessops-catalog-api",
            "schemaVersion": "1"
          }
        SqsQueueParameters:
          MessageGroupId: $.dynamodb.Keys.sk.S
          MessageDeduplicationId: $.eventID
      LogConfiguration:
        Level: ERROR
        CloudwatchLogsLogDestination:
          LogGroupArn: !GetAtt CatalogEventPipeLogGroup.Arn

  CatalogEventPipeFailureMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CatalogEventPipeLogGroup
      FilterPattern: '"ExecutionFailed"'
      MetricTransformations:
        - MetricName: CatalogEventPipeFailures
          MetricNamespace: ServerlessOps/CatalogEvents
          MetricValue: '1'

  CatalogEventPipeFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-catalog-event-pipe-failures'
      AlarmDescription: !Sub 'Catalog event delivery failed. Inspect ${CatalogEventPipeFailureQueue} for the original stream record, then correlate its eventID and dynamodb.Keys.sk.S to replay or investigate the entity.'
      Namespace: ServerlessOps/CatalogEvents
      MetricName: CatalogEventPipeFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # Functions
  CreateEntityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src/handlers/CreateEntity
      Handler: function.handler_create
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DdbTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: !Ref EnableMinify
        Target: "es2024"
        Format: "esm"
        MainFields: module,main # This is to help with ESM modules
        Sourcemap: !Ref EnableSourceMaps
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - function.ts

  CreateEntityFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt CreateEntityFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com


  UpsertEntityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src/handlers/CreateEntity
      Handler: function.handler_upsert
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DdbTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: !Ref EnableMinify
        Target: "es2024"
        Format: "esm"
        MainFields: module,main # This is to help with ESM modules
        Sourcemap: !Ref EnableSourceMaps
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - function.ts

  UpsertEntityFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt UpsertEntityFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com


  GetEntityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src/handlers/GetEntity
      Handler: function.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DdbTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: !Ref EnableMinify
        Target: "es2024"
        Format: "esm"
        MainFields: module,main # This is to help with ESM modules
        Sourcemap: !Ref EnableSourceMaps
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - function.ts

  GetEntityFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GetEntityFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com


  DeleteEntityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./src/handlers/DeleteEntity
      Handler: function.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DdbTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: !Ref EnableMinify
        Target: "es2024"
        Format: "esm"
        MainFields: module,main # This is to help with ESM modules
        Sourcemap: !Ref EnableSourceMaps
        OutExtension:
          - .js=.mjs
        EntryPoints:
          - function.ts

  DeleteEntityFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt DeleteEntityFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  # APIG
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref Hostname
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Hostname
          HostedZoneId: !Ref DnsZoneId

  RestApiIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !GetAtt DdbTable.Arn

  RestApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/api-gateway/${AWS::StackName}"
      RetentionInDays: 7

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref CodeBranch
      Domain:
        DomainName: !Ref Hostname
        CertificateArn: !Ref SiteCertificate
        Route53:
          HostedZoneId: !Ref DnsZoneId
        EndpointConfiguration: REGIONAL
      AccessLogSetting:
        DestinationArn: !GetAtt RestApiLogGroup.Arn
        Format: |
          {"requestId":"$context.requestId","extendedRequestId":"$context.extendedRequestId","xrayTraceId":"$context.xrayTraceId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","userAgent":"$context.identity.userAgent","authorizer":{"error":"$context.authorizer.error","status":"$context.authorizer.status","claims":{"sub":"$context.authorizer.claims.sub","scope":"$context.authorizer.claims.scope","exp":"$context.authorizer.claims.exp","iat":"$context.authorizer.claims.iat","jti":"$context.authorizer.claims.jti"}},"integration":{"requestId":"$context.integration.requestId","functionStatus":"$context.integration.status","lambdaStatus":"$context.integrationStatus"}}
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          MetricsEnabled: true
          DataTraceEnabled: false
      DefinitionBody:
        Fn::Transform:
          Name: "AWS::Include"
          Parameters:
            Location: "openapi.yaml"

Outputs:
  CatalogEventPipeFailureQueueArn:
    Description: ARN of the queue containing catalog stream records that exhausted Pipe retries
    Value: !GetAtt CatalogEventPipeFailureQueue.Arn

  CatalogEventPipeFailureQueueUrl:
    Description: URL of the queue containing catalog stream records that exhausted Pipe retries
    Value: !Ref CatalogEventPipeFailureQueue
