name: TechDocs

on:
  workflow_dispatch:
  push:
    paths:
      - 'specs/**'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/techdocs.yml'

concurrency:
  group: techdocs-${{ github.ref }}
  # Runs only build what their own push changed, so a newer run must not
  # cancel an older one.
  cancel-in-progress: false

jobs:
  discover:
    name: Discover docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Setup job workspace
        uses: ServerlessOpsIO/gha-setup-workspace@v1

      # There are two kinds of TechDocs target, and a project may have either,
      # both or neither:
      #   - each directory under specs/ that has a spec.md
      #   - the docs/ directory, which documents the project itself
      # A push only builds the targets it changed. Everything is built on a
      # manual run, on the first push of a branch, when this workflow changes,
      # or when the changed files cannot be determined.
      - name: List targets
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          all_specs=$(
            find specs -mindepth 2 -maxdepth 2 -name spec.md -print 2>/dev/null \
              | xargs -r -n1 dirname \
              | xargs -r -n1 basename \
              | sort
          )
          has_docs=''
          if [ -n "$(find docs -name '*.md' -print -quit 2>/dev/null)" ]; then
            has_docs='true'
          fi

          build_all=''
          changed=''
          if [ "${EVENT_NAME}" != 'push' ]; then
            build_all='not a push'
          elif [ -z "${BEFORE}" ] || [ "${BEFORE}" = '0000000000000000000000000000000000000000' ]; then
            build_all='first push of this branch'
          elif ! changed=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${GITHUB_SHA}" --jq '.files[].filename'); then
            build_all='could not compare commits'
          elif [ "$(printf '%s\n' "${changed}" | wc -l)" -ge 300 ]; then
            # The compare API lists at most 300 files.
            build_all='too many changed files to list'
          elif printf '%s\n' "${changed}" | grep -qx '.github/workflows/techdocs.yml'; then
            build_all='workflow changed'
          fi

          if [ -n "${build_all}" ]; then
            echo "Building everything: ${build_all}"
            specs="${all_specs}"
            docs="${has_docs}"
          else
            changed_specs=$(printf '%s\n' "${changed}" | sed -n 's|^specs/\([^/]*\)/.*|\1|p' | sort -u)
            specs=$(printf '%s\n' "${all_specs}" | grep -Fx -f <(printf '%s\n' "${changed_specs}") || true)
            docs=''
            if [ -n "${has_docs}" ] && printf '%s\n' "${changed}" | grep -qE '^(docs/|mkdocs\.yml$)'; then
              docs='true'
            fi
          fi

          # name:    job and artifact name
          # dir:     where the Markdown lives
          # catalog: the catalog-info.yaml of the entity the docs belong to
          # content: the folder name used for the Markdown in the staged project
          targets=$(
            printf '%s\n' "${specs}" | jq -R -s -c --arg docs "${docs}" '
              (split("\n") | map(select(length > 0) | {
                name: .,
                dir: ("specs/" + .),
                catalog: ("specs/" + . + "/catalog-info.yaml"),
                content: "spec"
              }))
              + (if $docs == "true" then [{
                name: "docs",
                dir: "docs",
                catalog: "catalog-info.yaml",
                content: "docs"
              }] else [] end)
            '
          )
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "Targets to build: ${targets}"

  build:
    name: Build ${{ matrix.target.name }}
    needs:
      - discover
    if: needs.discover.outputs.targets != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover.outputs.targets) }}
    env:
      TARGET_NAME: ${{ matrix.target.name }}
      TARGET_DIR: ${{ matrix.target.dir }}
      CATALOG_FILE: ${{ matrix.target.catalog }}
      CONTENT_DIR: ${{ matrix.target.content }}

    steps:
      - name: Setup job workspace
        uses: ServerlessOpsIO/gha-setup-workspace@v1

      - name: Setup NodeJS
        id: install-node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Python
        id: install-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install MkDocs
        run: pip install 'mkdocs-techdocs-core==1.*'

      # Lay the target out as a MkDocs project in $RUNNER_TEMP/build, outside the
      # git checkout. Spec directories have no mkdocs.yml, and docs/ may not have
      # one either, so one is generated unless the project supplies its own.
      - name: Stage MkDocs project
        env:
          WORK_DIR: ${{ runner.temp }}/build/source
        run: |
          content="${WORK_DIR}/${CONTENT_DIR}"
          mkdir -p "${content}"
          cp -R "${TARGET_DIR}/." "${content}/"
          rm -f "${content}/catalog-info.yaml"

          title=''
          description=''
          if [ -f "${CATALOG_FILE}" ]; then
            title=$(yq 'select(document_index == 0) | .metadata.title // .metadata.name // ""' "${CATALOG_FILE}")
            description=$(yq 'select(document_index == 0) | .metadata.description // ""' "${CATALOG_FILE}")
          fi
          export TITLE="${title:-$TARGET_NAME}"
          export DESCRIPTION="${description}"

          if [ "${TARGET_DIR}" = 'docs' ] && [ -f mkdocs.yml ]; then
            cp mkdocs.yml "${WORK_DIR}/mkdocs.yml"
          else
            yq -n '
              .site_name = strenv(TITLE) |
              .site_description = strenv(DESCRIPTION) |
              .docs_dir = strenv(CONTENT_DIR) |
              .plugins = ["techdocs-core"]
            ' > "${WORK_DIR}/mkdocs.yml"
          fi

          # TechDocs needs a landing page at the site root.
          if [ ! -f "${content}/index.md" ]; then
            {
              printf '# %s\n\n' "${TITLE}"
              if [ -n "${DESCRIPTION}" ]; then
                printf '%s\n\n' "${DESCRIPTION}"
              fi
              for doc in spec plan research data-model quickstart tasks; do
                if [ -f "${content}/${doc}.md" ]; then
                  printf -- '- [%s](%s.md)\n' "${doc}" "${doc}"
                fi
              done
            } > "${content}/index.md"
          fi

          cat "${WORK_DIR}/mkdocs.yml"

      - name: Build TechDocs
        env:
          WORK_DIR: ${{ runner.temp }}/build/source
          SITE_DIR: ${{ runner.temp }}/build/site
        run: |
          npx --yes @techdocs/cli generate \
            --no-docker \
            --verbose \
            --source-dir "${WORK_DIR}" \
            --output-dir "${SITE_DIR}"

      - name: Assume AWS Credentials
        uses: ServerlessOpsIO/gha-assume-aws-credentials@v1
        with:
          build_aws_account_id: ${{ secrets.AWS_CICD_ACCOUNT_ID }}
          deploy_aws_account_id: ${{ secrets.DEPLOYMENT_ACCOUNT_ID }}

      # TechDocs are stored under the entity's namespace/kind/name, which comes
      # from the catalog-info.yaml of the spec or, for docs/, of the project.
      - name: Publish TechDocs
        env:
          SITE_DIR: ${{ runner.temp }}/build/site
          TECHDOCS_BUCKET: ${{ vars.TECHDOCS_BUCKET }}
        run: |
          if [ -z "${TECHDOCS_BUCKET}" ]; then
            echo "::error::The TECHDOCS_BUCKET variable is not set"
            exit 1
          fi
          if [ ! -f "${CATALOG_FILE}" ]; then
            echo "::error::${CATALOG_FILE} is required to publish TechDocs"
            exit 1
          fi
          entity=$(yq 'select(document_index == 0) | (.metadata.namespace // "default") + "/" + .kind + "/" + .metadata.name' "${CATALOG_FILE}")
          echo "Publishing ${entity} to ${TECHDOCS_BUCKET}"

          npx --yes @techdocs/cli publish \
            --publisher-type awsS3 \
            --storage-name "${TECHDOCS_BUCKET}" \
            --entity "${entity}" \
            --directory "${SITE_DIR}"

      - name: Upload TechDocs site
        uses: actions/upload-artifact@v7
        with:
          name: techdocs-${{ matrix.target.name }}
          path: ${{ runner.temp }}/build/site
          if-no-files-found: error
