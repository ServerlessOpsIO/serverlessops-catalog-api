name: TechDocs

on:
  workflow_dispatch:
  push:
    paths:
      - 'specs/**'
      - '.github/workflows/techdocs.yml'

concurrency:
  group: techdocs-${{ github.ref }}
  # Runs only build the specs their own push changed, so a newer run must not
  # cancel an older one.
  cancel-in-progress: false

jobs:
  discover:
    name: Discover specs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      specs: ${{ steps.specs.outputs.specs }}

    steps:
      - name: Setup job workspace
        uses: ServerlessOpsIO/gha-setup-workspace@v1

      # Every directory under specs/ that has a spec.md is a spec. A push only
      # builds the specs it changed. Everything is built on a manual run, on the
      # first push of a branch, when this workflow changes, or when the changed
      # files cannot be determined.
      - name: List specs
        id: specs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          all=$(
            find specs -mindepth 2 -maxdepth 2 -name spec.md -print 2>/dev/null \
              | xargs -r -n1 dirname \
              | xargs -r -n1 basename \
              | sort
          )

          build_all=''
          changed=''
          if [ "${EVENT_NAME}" != 'push' ]; then
            build_all='not a push'
          elif [ -z "${BEFORE}" ] || [ "${BEFORE}" = '0000000000000000000000000000000000000000' ]; then
            build_all='first push of this branch'
          elif ! changed=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE}...${GITHUB_SHA}" --jq '.files[].filename'); then
            build_all='could not compare commits'
          elif [ "$(printf '%s\n' "${changed}" | wc -l)" -ge 300 ]; then
            # The compare API lists at most 300 files.
            build_all='too many changed files to list'
          elif printf '%s\n' "${changed}" | grep -qx '.github/workflows/techdocs.yml'; then
            build_all='workflow changed'
          fi

          if [ -n "${build_all}" ]; then
            echo "Building all specs: ${build_all}"
            selected="${all}"
          else
            changed_specs=$(printf '%s\n' "${changed}" | sed -n 's|^specs/\([^/]*\)/.*|\1|p' | sort -u)
            selected=$(printf '%s\n' "${all}" | grep -Fx -f <(printf '%s\n' "${changed_specs}") || true)
          fi

          specs=$(printf '%s\n' "${selected}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "specs=${specs}" >> "$GITHUB_OUTPUT"
          echo "Specs to build: ${specs}"

  build:
    name: Build ${{ matrix.spec }}
    needs:
      - discover
    if: needs.discover.outputs.specs != '[]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        spec: ${{ fromJson(needs.discover.outputs.specs) }}
    env:
      SPEC: ${{ matrix.spec }}
      SPEC_DIR: specs/${{ matrix.spec }}

    steps:
      - name: Setup job workspace
        uses: ServerlessOpsIO/gha-setup-workspace@v1

      - name: Setup NodeJS
        id: install-node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Python
        id: install-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install MkDocs
        run: pip install 'mkdocs-techdocs-core==1.*'

      # Spec directories hold their Markdown at the top level and have no
      # mkdocs.yml, so lay the spec out as a MkDocs project before building.
      # All build work happens in $RUNNER_TEMP/build, outside the git checkout.
      - name: Stage MkDocs project
        env:
          WORK_DIR: ${{ runner.temp }}/build/source
        run: |
          mkdir -p "${WORK_DIR}/spec"
          cp -R "${SPEC_DIR}/." "${WORK_DIR}/spec/"
          rm -f "${WORK_DIR}/spec/catalog-info.yaml"

          title=''
          description=''
          if [ -f "${SPEC_DIR}/catalog-info.yaml" ]; then
            title=$(yq 'select(document_index == 0) | .metadata.title // .metadata.name // ""' "${SPEC_DIR}/catalog-info.yaml")
            description=$(yq 'select(document_index == 0) | .metadata.description // ""' "${SPEC_DIR}/catalog-info.yaml")
          fi
          export TITLE="${title:-$SPEC}"
          export DESCRIPTION="${description}"

          yq -n '
            .site_name = strenv(TITLE) |
            .site_description = strenv(DESCRIPTION) |
            .docs_dir = "spec" |
            .plugins = ["techdocs-core"]
          ' > "${WORK_DIR}/mkdocs.yml"

          # TechDocs needs a landing page at the site root.
          if [ ! -f "${WORK_DIR}/spec/index.md" ]; then
            {
              printf '# %s\n\n' "${TITLE}"
              if [ -n "${DESCRIPTION}" ]; then
                printf '%s\n\n' "${DESCRIPTION}"
              fi
              for doc in spec plan research data-model quickstart tasks; do
                if [ -f "${WORK_DIR}/spec/${doc}.md" ]; then
                  printf -- '- [%s](%s.md)\n' "${doc}" "${doc}"
                fi
              done
            } > "${WORK_DIR}/spec/index.md"
          fi

          cat "${WORK_DIR}/mkdocs.yml"

      - name: Build TechDocs
        env:
          WORK_DIR: ${{ runner.temp }}/build/source
          SITE_DIR: ${{ runner.temp }}/build/site
        run: |
          npx --yes @techdocs/cli generate \
            --no-docker \
            --verbose \
            --source-dir "${WORK_DIR}" \
            --output-dir "${SITE_DIR}"

      - name: Assume AWS Credentials
        uses: ServerlessOpsIO/gha-assume-aws-credentials@v1
        with:
          build_aws_account_id: ${{ secrets.AWS_CICD_ACCOUNT_ID }}
          deploy_aws_account_id: ${{ secrets.DEPLOYMENT_ACCOUNT_ID }}

      # TechDocs are stored under the entity's namespace/kind/name, which comes
      # from the spec's catalog-info.yaml.
      - name: Publish TechDocs
        env:
          SITE_DIR: ${{ runner.temp }}/build/site
          TECHDOCS_BUCKET: ${{ vars.TECHDOCS_BUCKET }}
        run: |
          if [ -z "${TECHDOCS_BUCKET}" ]; then
            echo "::error::The TECHDOCS_BUCKET variable is not set"
            exit 1
          fi
          if [ ! -f "${SPEC_DIR}/catalog-info.yaml" ]; then
            echo "::error::${SPEC_DIR}/catalog-info.yaml is required to publish TechDocs"
            exit 1
          fi
          entity=$(yq 'select(document_index == 0) | (.metadata.namespace // "default") + "/" + .kind + "/" + .metadata.name' "${SPEC_DIR}/catalog-info.yaml")
          echo "Publishing ${entity} to ${TECHDOCS_BUCKET}"

          npx --yes @techdocs/cli publish \
            --publisher-type awsS3 \
            --storage-name "${TECHDOCS_BUCKET}" \
            --entity "${entity}" \
            --directory "${SITE_DIR}"

      - name: Upload TechDocs site
        uses: actions/upload-artifact@v7
        with:
          name: techdocs-${{ matrix.spec }}
          path: ${{ runner.temp }}/build/site
          if-no-files-found: error
